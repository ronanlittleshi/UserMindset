<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖小保 - 平台保障助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 手机模拟器容器 */
        .phone-container {
            width: 480px;
            height: 1024px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }

        /* 广告底图 */
        .ad-background {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        
        .ad-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        
        /* 视频播放/暂停提示（半透明） */
        .video-overlay-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        /* 抖小保头像容器 */
        .avatar-placeholder {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
        }
        
        /* 转化记录内容样式 */
        .convert-record-list {
            padding: 20px;
        }
        
        .record-item {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .record-item:hover {
            background: #f0f0f0;
            transform: translateX(3px);
        }
        
        .record-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        
        .record-time {
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
        }
        
        .record-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .record-status.success {
            background: #e8f5e9;
            color: #4caf50;
        }
        
        .record-status.pending {
            background: #fff3e0;
            color: #ff9800;
        }
        
        /* 客服内容样式 */
        .customer-service-content-inner {
            padding: 20px;
        }
        
        .service-option {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .service-option:hover {
            border-color: #ff6b6b;
            background: #fff5f5;
        }
        
        .service-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .service-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        /* 抖小保浮窗 - 移到左边 */
        .dou-xiao-bao {
            position: absolute;
            left: 20px;
            top: 180px;
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 100;
            transition: transform 0.2s, opacity 0.3s;
            opacity: 1;
        }
        
        .dou-xiao-bao.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .dou-xiao-bao:hover {
            transform: scale(1.1);
        }

        .dou-xiao-bao.wave {
            animation: wave 0.6s ease-in-out;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }

        .dou-xiao-bao-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
        }

        .dou-xiao-bao-label {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 12px;
            white-space: nowrap;
            font-weight: 500;
        }

        /* 提醒气泡 */
        .reminder-bubble {
            position: absolute;
            left: 100px;
            top: 175px;
            background: white;
            padding: 12px 18px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            font-size: 14px;
            color: #333;
            z-index: 99;
            display: none;
            animation: bubbleIn 0.4s ease;
            max-width: 180px;
        }

        .reminder-bubble.show {
            display: block;
        }

        .reminder-bubble::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            border: 8px solid transparent;
            border-right-color: white;
        }

        @keyframes bubbleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 猜你想问面板 */
        .guess-panel {
            position: absolute;
            left: 100px;
            top: 230px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.25);
            width: 280px;
            display: none;
            z-index: 98;
        }

        .guess-panel.show {
            display: block;
            animation: slideIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .guess-header {
            padding: 18px 20px;
            border-bottom: 1px solid #f0f0f0;
            font-weight: 700;
            color: #333;
            display: flex;
            align-items: center;
            font-size: 16px;
        }

        .guess-header-icon {
            margin-right: 10px;
            font-size: 20px;
        }

        .guess-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f8f8f8;
            cursor: pointer;
            transition: all 0.2s;
            color: #333;
            font-size: 15px;
            line-height: 1.4;
        }

        .guess-item:hover {
            background: #fafafa;
            padding-left: 25px;
        }

        .guess-item:last-child {
            border-bottom: none;
            border-radius: 0 0 18px 18px;
        }

        .guess-item-number {
            color: #ff6b6b;
            font-weight: 600;
            margin-right: 8px;
        }

        /* 对话界面 */
        .chat-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f5f5f5;
            display: none;
            z-index: 200;
        }

        .chat-screen.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .chat-header {
            height: 100px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            display: flex;
            align-items: flex-end;
            padding: 0 20px 20px;
            box-shadow: 0 4px 20px rgba(238, 90, 36, 0.3);
        }

        .chat-back {
            font-size: 28px;
            cursor: pointer;
            margin-right: 15px;
            color: white;
            transition: transform 0.2s;
        }

        .chat-back:hover {
            transform: translateX(-3px);
        }

        .chat-title {
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        .chat-container {
            height: calc(100% - 100px - 80px);
            overflow-y: auto;
            padding: 25px 20px;
        }

        .message {
            margin-bottom: 25px;
            display: flex;
            animation: messageIn 0.4s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 12px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(238, 90, 36, 0.3);
        }

        .message.ai .message-avatar {
            background: white;
            box-shadow: 0 3px 15px rgba(0,0,0,0.2);
        }

        .message.ai .message-avatar img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }

        .message.user .message-avatar {
            order: 2;
            margin-right: 0;
            margin-left: 12px;
            background: #ddd;
            box-shadow: none;
        }

        .message-content {
            max-width: 280px;
            background: white;
            padding: 15px 18px;
            border-radius: 18px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            font-size: 15px;
            line-height: 1.7;
            color: #333;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            box-shadow: 0 3px 15px rgba(238, 90, 36, 0.3);
        }

        .message-time {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-bottom: 25px;
        }

        /* 打字输入框 */
        .chat-input {
            height: 80px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-top: 1px solid #eee;
        }

        .input-box {
            flex: 1;
            height: 48px;
            background: #f5f5f5;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            margin-right: 15px;
            cursor: text;
        }

        .input-field {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 15px;
            outline: none;
            color: #333;
        }

        .input-field::placeholder {
            color: #999;
        }

        .input-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .chat-action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 5px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .chat-action-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .chat-action-icon {
            font-size: 22px;
        }

        .chat-action-text {
            font-size: 10px;
            color: #666;
        }

        .send-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: scale(1.1);
        }

        .send-btn:disabled {
            background: #ddd;
            cursor: not-allowed;
        }

        /* 热线弹窗 */
        .hotline-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .hotline-modal.show {
            display: flex;
        }

        .hotline-modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 300px;
            text-align: center;
        }

        .hotline-modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .hotline-modal-number {
            font-size: 28px;
            font-weight: 700;
            color: #ee5a24;
            margin-bottom: 25px;
        }

        .hotline-modal-buttons {
            display: flex;
            gap: 12px;
        }

        .hotline-modal-btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }

        .hotline-modal-btn:hover {
            transform: scale(1.05);
        }

        .hotline-modal-btn.cancel {
            background: #f5f5f5;
            color: #666;
        }

        .hotline-modal-btn.confirm {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
        }

        /* 打字中提示 */
        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 15px 18px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            max-width: 280px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* 跳转按钮 */
        .jump-button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 15px;
        }

        .jump-button:hover {
            transform: scale(1.05);
        }

        /* 转化记录页面 */
        .convert-record-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: none;
            z-index: 300;
        }

        .convert-record-page.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .convert-record-header {
            height: 100px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            display: flex;
            align-items: flex-end;
            padding: 0 20px 20px;
            box-shadow: 0 4px 20px rgba(238, 90, 36, 0.3);
        }

        .convert-record-back {
            font-size: 28px;
            cursor: pointer;
            margin-right: 15px;
            color: white;
            transition: transform 0.2s;
        }

        .convert-record-back:hover {
            transform: translateX(-3px);
        }

        .convert-record-title {
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        .convert-record-content {
            height: calc(100% - 100px);
            background-image: url('转化记录列表页.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 客服页面 */
        .customer-service-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: none;
            z-index: 400;
        }

        .customer-service-page.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .customer-service-header {
            height: 100px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            display: flex;
            align-items: flex-end;
            padding: 0 20px 20px;
            box-shadow: 0 4px 20px rgba(238, 90, 36, 0.3);
        }

        .customer-service-back {
            font-size: 28px;
            cursor: pointer;
            margin-right: 15px;
            color: white;
            transition: transform 0.2s;
        }

        .customer-service-back:hover {
            transform: translateX(-3px);
        }

        .customer-service-title {
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        .customer-service-content {
            height: calc(100% - 100px);
            background-image: url('客服页面.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
    

    
    <div class="phone-container">
        <!-- 广告底图 - 动态视频 -->
        <div class="ad-background" id="adBackground" onclick="toggleVideoPlay(event)">
            <video class="ad-video" id="adVideo" autoplay muted loop playsinline>
                <source src="Feed刷广告.mp4" type="video/mp4">
            </video>
            <!-- 视频播放/暂停提示 -->
            <div class="video-overlay-hint" id="videoOverlayHint">点击暂停/播放</div>
        </div>
        
        <!-- 抖小保浮窗 - 左边 -->
        <div class="dou-xiao-bao" id="douXiaoBao" onclick="toggleGuessPanel()">
            <img src="抖小保.png" class="dou-xiao-bao-img" alt="抖小保">
            <span class="dou-xiao-bao-label">抖小保</span>
        </div>
        
        <!-- 提醒气泡 -->
        <div class="reminder-bubble" id="reminderBubble">
            👋 嗨！有问题随时找我哦~
        </div>
        
        <!-- 猜你想问面板 -->
        <div class="guess-panel" id="guessPanel">
            <div class="guess-header">
                <span class="guess-header-icon">🛡️</span>
                平台保障
            </div>
            <div class="guess-item" onclick="openChat('平台能为我提供哪些保障？')">
                <span class="guess-item-number">1.</span>平台能为我提供哪些保障？
            </div>
            <div class="guess-item" onclick="openChat('什么叫平台保障')">
                <span class="guess-item-number">2.</span>什么叫平台保障
            </div>
            <div class="guess-item" onclick="openChat('消费后出现纠纷怎么办？')">
                <span class="guess-item-number">3.</span>消费后出现纠纷怎么办？
            </div>
            <div class="guess-item" onclick="openChat('其他同类型内容推荐')">
                <span class="guess-item-number">4.</span>其他同类型内容推荐
            </div>
        </div>
        
        <!-- 对话界面 -->
        <div class="chat-screen" id="chatScreen">
            <div class="chat-header">
                <span class="chat-back" onclick="closeChat()">←</span>
                <span class="chat-title">抖小保 - 平台保障助手</span>
            </div>
            
            <div class="chat-container" id="chatContainer">
                <div class="message-time">刚刚</div>
                
                <div class="message ai">
                    <div class="message-avatar">
                        <img src="抖小保.png" alt="抖小保" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover;">
                    </div>
                    <div class="message-content">
                        您好！我是抖小保，平台的保障助手。有什么可以帮助您的吗？
                    </div>
                </div>
            </div>
            
            <div class="chat-input">
                <div class="input-box">
                    <input type="text" class="input-field" id="userInput" placeholder="输入你的问题..." onkeypress="handleKeyPress(event)">
                </div>
                <div class="input-actions">
                    <div class="chat-action-btn" onclick="showHotlineAlert()">
                        <span class="chat-action-icon">📞</span>
                        <span class="chat-action-text">平台热线</span>
                    </div>
                    <div class="chat-action-btn" onclick="startNewChat()">
                        <span class="chat-action-icon">➕</span>
                        <span class="chat-action-text">+新聊天</span>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
        
        <!-- 转化记录页面 -->
        <div class="convert-record-page" id="convertRecordPage">
            <div class="convert-record-header">
                <span class="convert-record-back" onclick="closeConvertRecordPage()">←</span>
                <span class="convert-record-title">我的转化记录</span>
            </div>
            <div class="convert-record-content"></div>
        </div>
        
        <!-- 客服页面 -->
        <div class="customer-service-page" id="customerServicePage">
            <div class="customer-service-header">
                <span class="customer-service-back" onclick="closeCustomerServicePage()">←</span>
                <span class="customer-service-title">平台客服</span>
            </div>
            <div class="customer-service-content"></div>
        </div>
        
        <!-- 视频页面 -->
        <div class="customer-service-page" id="videoPage">
            <div class="customer-service-header">
                <span class="customer-service-back" onclick="closeVideoPage()">←</span>
                <span class="customer-service-title">推荐内容</span>
            </div>
            <div class="customer-service-content" style="height: 100%; display: flex; justify-content: center; align-items: center;">
                <video id="videoPageVideo" class="ad-video" autoplay controls style="width: 100%; height: 100%; object-fit: cover;">
                    <source src="" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>
            </div>
        </div>

        <!-- 热线弹窗 -->
        <div class="hotline-modal" id="hotlineModal">

        // 检查当前时间是否在广告时间段内
        function isInAdTimeRange(currentTime) {
            for (let range of adTimeRanges) {
                if (currentTime >= range.start && currentTime <= range.end) {
                    return true;
                }
            }
            return false;
        }
        
        // 根据视频时间更新抖小保显示
        function updateDouXiaoBaoByTime() {
            const video = document.getElementById('adVideo');
            if (!video) return;

            const newHasAd = isInAdTimeRange(currentTime);
            
            if (newHasAd !== hasAd) {

                updateDouXiaoBaoVisibility();
                
                if (hasAd) {
                    if (!firstReminderShown) {
                        showReminder();
                        startReminderLoop();
